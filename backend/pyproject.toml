[project]
name = "checkr-backend"
version = "0.1.0"
description = "CheckR — AI-assisted handwritten examination answer-sheet evaluation backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Data layer
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "greenlet>=3.0",
    # Config & validation
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    # Auth
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    # Integrations
    "httpx>=0.27",
    "redis>=5.0",
    # Imaging / documents
    "Pillow>=10.3",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]
s3 = ["boto3>=1.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
